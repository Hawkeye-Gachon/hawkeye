# 실험 설정 (docs/PLAN.md 5~7장, 11장).
# 모든 명령은 `python -m drowsy.<모듈> --config config/default.yaml` 형식으로 저장소 루트에서 실행한다
# (drowsy.spec과 drowsy.vectors는 --config 대신 --spec, --rules를 받는다).
# 실제 데이터를 쓸 때는 이 파일을 고치지 않는다. 이 파일을 config/local.yaml(git 제외)로 복사해 paths.rldd_root 등을 적고
# --config config/local.yaml로 준다(README 4.0절). 이 파일에 키가 더해지면 사본에도 옮겨 적는다.
# 경로는 실행 위치(저장소 루트) 기준 상대 경로다.
# 이식 코드의 상수는 여기가 아니라 config/feature_spec.json(pipeline 블록)과 config/rules.yaml에 있다.

paths:
  rldd_root: null                          # UTA-RLDD 사본 위치(Q8). 이 파일에서는 늘 null(테스트가 확인한다). 실제 경로는 config/local.yaml에 적는다. null이면 합성 데이터를 쓴다
  unlabeled_root: null                     # 팀 수집 차량 영상(시간당 경고 수 확인용). 이 파일에서는 null, 실제 경로는 config/local.yaml에 적는다
  raw_dir: data/raw                        # 영상별 RawFrame parquet
  synth_dir: data/synth                    # 합성 데이터셋(python -m drowsy.synth --out data/synth). rldd_root가 null이면 학습·평가가 이것을 쓴다
  model_path: models/face_landmarker.task  # Q2: 추출 시작 시 sha256을 feature_spec의 값과 비교한다
  feature_spec: config/feature_spec.json
  rules: config/rules.yaml
  export_dir: export                       # 앱에 넘기는 파일. 합성 데이터·--fast 모델은 여기와 그 아래로 내보내지 못한다. 상대 경로는 실행 폴더와 저장소 루트 둘 다를 기준으로 본다. 이 값을 다른 폴더로 바꿔도 저장소의 export/는 늘 지킨다
  reports_dir: reports                     # 실행별 리포트. --run-name은 이 아래의 폴더 이름 하나여야 한다(경로 구분자, ..은 거부)

extraction:
  workers: 4                   # 영상 단위 다중 프로세스 수(2.3절: CPU 프레임당 약 4 ms)
  pilot_videos: 6              # M3: 전체 추출 전에 시험 추출할 영상 수
  native_subdir: native        # raw_dir 아래 원본 프레임률 추출 결과
  rotation_overrides: {}       # 수동 회전 보정표(12장). 영상 상대 경로(--video는 파일 이름) -> 반시계 회전 각도(0, 90, 180, 270). 자동 점검 결과보다 우선하고, --video에서는 --rotation이 이 표보다 우선한다. 이번 입력의 영상과 맞지 않는 키가 있으면 추출을 시작하지 않는다. 스텝 표·E0·train·baseline_lgbm 명령은 이 표로 회전을 가르지 못한 영상을 센다(학습 명령은 학습 전에 출력만 하고 빼지 않는다)
  rotation_check_frames: 12    # 가정. 추출의 모든 입력(--video, --input-dir, --dataset, --unlabeled)과 python -m drowsy.demo --video가 하는 영상별 회전 자동 점검(12장)에 쓰는 표본 프레임 수
  rotation_check_interval_ms: 2000   # 가정. 표본 프레임 사이의 간격. 12장 x 2초면 영상 앞 24초를 본다
  rotation_roll_margin_deg: 15.0     # 가정. 회전 점검에서 얼굴 검출 비율이 비슷한 각도들의 |roll 중앙값| 차이가 이 값 미만이면 가르지 못한 것으로 표시한다(리포트의 rotation_ambiguous)
  unlabeled_rotation_overrides: {}   # --unlabeled 추출의 수동 회전 보정표. unlabeled_root 기준 영상 상대 경로 -> 회전 각도(0, 90, 180, 270)
  drop_sim:                    # 기기 프레임 누락 모사(5.2절 증강 (1)): MediaPipe 앞단의 흐름 제한기를 흉내 낸다
    subdir: fps15              # raw_dir 아래 모사 추출 결과
    latency_ms_mean: 66.7      # 가정. 프레임당 처리 지연 평균. 약 15 fps(1000 / 15)가 되게 한 값. 실기기 로그를 받으면 바꾼다(1.3절)
    latency_ms_std: 8.0        # 가정. 지연의 표준편차
    seed: 0

windows:
  window_steps: 120            # feature_spec.json의 window_steps와 같아야 한다
  train_stride: 5              # 학습 보폭(초). LightGBM의 학습 창과 리포트의 창 수에 쓴다. 가정: 신경망은 영상의 보폭 1 창에서 균등하게 뽑는다(보폭 격자에서 시작 위치를 무작위로 옮기는 것과 같은 분포)
  eval_stride: 1               # 평가 보폭(초)

training:                      # 5.2절
  arms: [alert_baseline, global, session_baseline]   # 정규화 조건 셋(D1)
  export_arm: alert_baseline   # 내보낼 모델의 학습 조건(D1)
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  batch_size: 64
  updates_per_unit: 200        # 표집에 자연스러운 에폭이 없어 200 갱신을 한 단위로 삼는다
  max_units: 60
  patience_units: 10           # 내부 검증 macro-F1 기준 조기 종료
  label_smoothing: 0.1
  ordinal_neighbor_mass: 0.2   # 가정. 부가 실험(PLAN 11장 E3)의 순서형 소프트 라벨: 정답 클래스가 이웃 클래스에 나눠 주는 확률(끝 클래스는 하나뿐인 이웃에 전부, 가운데 클래스는 양쪽에 절반씩). 주 실행은 쓰지 않고 python -m drowsy.train ... cv --ordinal만 읽는다(라벨 스무딩 대신 쓴다)
  noise_sigma: 0.05            # 표준화 공간의 가우시안 잡음
  frame_drop_min: 0.10         # 증강 (2): 저장된 신호에서 프레임을 무작위로 버리는 비율의 범위(근사). 세션마다 이 범위에서 고르게 뽑는다. 학습(python -m drowsy.train)과 python -m drowsy.dataset --frame-drop-variants가 쓴다
  frame_drop_max: 0.30
  fps_sim_share: 0.25          # 가정. 증강 (1): 누락 모사 추출(raw_dir/fps15 또는 synth_dir + _fps15)의 스텝 표가 있으면 학습 표본의 이 비율을 거기서 뽑는다. 없으면 쓰지 않고 그 몫은 원본 추출로 간다. 그 추출이 원본의 세션을 다 덮지 못하면 학습을 시작하지 않는다(--allow-partial-fps-sim으로 풀 수 있다)
  frame_drop_share: 0.25       # 가정. 증강 (2): 프레임 누락 변형(원본 추출의 프레임을 frame_drop_min~max 비율로 버리고 다시 계산한 스텝 표)에서 뽑는 학습 표본의 비율. 변형이 여럿이면 똑같이 나눈다. 두 비율의 합은 1보다 작아야 하고 나머지(기본 0.5)가 원본 추출의 몫이다. 변형에 창이 없는 영상의 몫은 원본으로 간다. 신경망 학습(train cv, train final)만 섞고 LightGBM은 섞지 않는다
  frame_drop_variants: 1       # 가정. 증강 (2)의 변형 수(변형 번호 0부터, 시드 0. python -m drowsy.dataset --frame-drop-variants 0이 만드는 것과 같은 캐시). 0이면 만들지 않고 그 몫은 원본 추출로 간다. 학습이 처음 돌 때 변형마다 전체 세션을 한 번 더 재생해 캐시에 둔다
  seeds: [0, 1, 2]             # 6장: 다시 학습할 때 시드 3개. 안쪽 선택의 학습은 첫 시드 하나만 쓴다
  final_seed: 0                # 11장: 최종 모델의 시드
  device: auto                 # auto | cpu | cuda
  tcn:                         # 탐색 범위(사전 고정): 채널 x 드롭아웃
    channels: [16, 32]
    dropout: [0.1, 0.3]
    kernel_size: 3
    dilations: [1, 2, 4, 8, 16]
  gru:                         # 탐색 범위(사전 고정): 은닉 x 드롭아웃
    hidden: [32, 64]
    dropout: [0.1, 0.3]

lgbm:                          # 5.3절. 비교 기준선이며 내보내지 않는다
  num_leaves: [7, 15]
  min_data_in_leaf: [20, 60]
  learning_rate: 0.05          # 가정. 계획서에 없는 값
  max_rounds: 300              # 가정. 부스팅 횟수 상한. 실제 횟수는 내부 검증으로 고른다
  early_stopping_rounds: 30    # 가정. 계획서에 없는 값. 내부 검증 성능이 이 횟수 동안 나아지지 않으면 멈춘다
  seed: 0
  reference_arm: alert_baseline   # 비교표와 D11의 기준이 되는 조건
  reference_w: 0.5                # 같은 기준의 closure W. feature_spec의 closure.w와 같아야 한다(다르면 기준 실행 baseline_lgbm cv가 시작하지 않는다)
  w_grid: [0.0, 0.5, 1.0]         # E1: W 비교(보고용). python -m drowsy.baseline_lgbm cv --all-w가 이 값들로 돈다. reference_w가 들어 있어야 한다

evaluation:                    # 6장
  n_folds: 5                   # 공식 5-fold. 실제 데이터의 fold 수가 이 값과 다르면 학습과 평가를 시작하지 않는다
  subjects_per_fold: 12        # fold k = 피험자 12(k-1)+1 ~ 12k. 고정된 대응이다(12가 아니면 학습과 평가를 시작하지 않는다)
  bootstrap_n: 10000           # 피험자 단위 부트스트랩 횟수
  bootstrap_seed: 0
  alarm_threshold_sweep: [0.5, 0.6, 0.7, 0.8, 0.9]   # 가정. "임계값을 바꿔 본 곡선"의 p_drowsy 시작 임계값. 주 수치는 rules.yaml의 0.6
  lgbm_min_macro_f1: 0.40      # E1 통과 기준: 내부 검증 macro-F1 평균이 이 값 미만이면 멈추고 보고
  quality_gate:                # D7. 라벨과 무관하게 고정. 보조 행의 평가 대상만 거른다
    min_face_ratio: 0.7        # 얼굴 검출 비율(시간 기준)
    min_windows: 1
  model_gate:                  # D11. 모두 만족할 때만 rules.yaml의 drowsiness.source를 model로 둔다(앱 조건 평가 기준)
    max_macro_f1_deficit: 0.02           # macro-F1이 LightGBM − 이 값 이상
    min_two_class_video_accuracy: 0.70   # 2클래스 영상 정확도
    max_false_alarms_per_hour: 2.0       # alert 영상 오경보 시간당 횟수
    max_alert_video_alarm_ratio: 0.10    # 판정이 한 번이라도 난 alert 영상 비율
    min_drowsy_video_alarm_ratio: 0.50   # 판정이 발생한 drowsy 영상 비율
  signal_gate:                 # E0 통과 기준(python -m drowsy.signal_check e0). 라벨을 쓰지 않고 전체 영상으로 판정한다. 비율의 단위는 세션(파일)이다
    min_baseline_ok_ratio: 0.9           # 기준선이 60초에 대체 없이 완성된 영상 비율
    blink_rate_min_per_min: 5.0
    blink_rate_max_per_min: 40.0
    min_blink_rate_ok_ratio: 0.8         # 깜빡임이 분당 5~40회인 영상 비율
    min_peak_closure_median: 0.8         # 깜빡임 정점 closure의 영상별 중앙값 하한
    min_peak_closure_ok_ratio: 0.8       # 위 조건을 만족하는 영상 비율

export:                        # 7장
  model_version: 0             # v0: 무작위 가중치(계약 확인용). 학습한 모델은 1부터
  opset: 17
  ir_version: 8
  input_name: features         # float32 [1, 120, 17], 원시 스텝 특징
  output_name: probs           # float32 [1, 3]
  max_file_bytes: 1000000      # "1 MB 미만"
  parity_tolerance: 0.0001     # PyTorch 대 onnxruntime 최대 절대 오차
  parity_random_inputs: 200    # 가정. 일치 검증에 쓰는 무작위 입력 수
  latency_runs: 1000
  intra_op_threads: 1
  int8_if_tcn: true            # D16: TCN이 최종 모델일 때만 INT8 파일을 만든다

demo:                          # 9장
  model_path: export/drowsiness_v1.onnx
  out_dir: out
  figure_dpi: 120

fast:                          # 연기 시험용 축소 설정(`python -m drowsy.train ... --fast`, `python -m drowsy.baseline_lgbm ... --fast`).
                               # 사전에 고정한 절차가 아니다. 전 과정이 도는지만 빨리 확인하며, 이 설정으로 만든 수치는 보고하지 않는다.
                               # 이 설정으로 학습한 모델(체크포인트의 fast 표시)은 paths.export_dir과 그 아래로 내보내지 못한다
  max_units: 6                 # training.max_units 대신
  patience_units: 2            # training.patience_units 대신
  updates_per_unit: 50         # training.updates_per_unit 대신
  seeds: [0]                   # training.seeds 대신
  tcn_channels: [16]           # training.tcn.channels 대신
  tcn_dropout: [0.1]           # training.tcn.dropout 대신
  gru_hidden: [32]             # training.gru.hidden 대신
  gru_dropout: [0.1]           # training.gru.dropout 대신
  lgbm_num_leaves: [7]         # lgbm.num_leaves 대신
  lgbm_min_data_in_leaf: [20]  # lgbm.min_data_in_leaf 대신
  lgbm_max_rounds: 40          # lgbm.max_rounds 대신
  bootstrap_n: 200             # evaluation.bootstrap_n 대신

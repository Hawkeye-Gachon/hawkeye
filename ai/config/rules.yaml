# 규칙 엔진과 경고 결정의 임계값 (docs/PLAN.md 8장).
#
# 앱에는 같은 내용을 export/rules.json으로 내보낸다:
#   python -m drowsy.spec export-rules --out export/rules.json
# 그 파일 바이트의 sha256이 rules_hash다(규칙 벡터와 오경보 리포트에 적는다).
#
# 단위: 시간은 정수 ms, 각도는 도, 속도는 km/h.
# 각 값 옆에 출처를 적는다. "잠정"은 공개 근거가 없거나 실제 데이터로 확인하지 못한 값이다.

# 시간 규칙 (3.3절의 설계 규칙. 잠정 아님).
# 규칙 엔진은 이 파일의 내용만 받으므로 feature_spec.json의 pipeline.clock과 같은 값을 여기에도 둔다.
# 두 곳의 값이 다르면 테스트가 실패한다.
clock:
  step_ms: 1000               # 3.3절, 4.4절. 스텝 길이
  max_hold_ms: 200            # 3.3절. 한 프레임의 상태를 다음 프레임까지 인정하는 최대 시간. 넘는 부분은 "데이터 없음"
  reset_gap_ms: 10000         # 3.3절. 프레임 간격이 이 값을 넘으면 검출기와 누적기를 초기화

# 전방 주시 영역 (8.1절). 상대 각도는 기준선 대비 Euler(R0ᵀ·R)이고 pitch는 턱이 내려갈 때 양수다.
forward_zone:
  yaw_abs_max_deg: 23.0       # 잠정. |상대 yaw| ≤ 이 값이면 영역 안. 검증된 공개 값 없음(openpilot은 약 23도, 2.6절)
  pitch_up_max_deg: 25.0      # 잠정. 위쪽 한계(상대 pitch ≥ −25). 검증된 공개 값 없음
  pitch_down_max_deg: 18.0    # 잠정. 아래쪽 한계(상대 pitch ≤ +18). 검증된 공개 값 없음(openpilot은 아래 약 18도)
  eye_aux_enabled: true       # D12. 명세의 eyeLook 기반 보조 판정. 이로 인한 이벤트는 source=eye
  gaze_h_abs_max: 0.25        # 잠정. |gaze_h − gaze_h0| > 이 값이면 영역 밖. 공개 근거 없음(D12)
  gaze_v_abs_max: 0.35        # 잠정. |gaze_v − gaze_v0| > 이 값이면 영역 밖. 공개 근거 없음(D12)
  debounce_ms: 250            # 잠정(설계값, 8.1절). 상태 변화 확정에 필요한 유지 시간. 확정되면 시작 시각을 소급
  face_loss_credit_ms: 3000   # 잠정(설계값, 8.1절). 영역 밖에서 얼굴이 사라지면 이 시간까지 영역 밖, 그 뒤는 "알 수 없음"

# 장시간 시선 이탈
gaze_away_long:
  onset_ms: 3000              # 명세. Euro NCAP 2026 v1.2의 장시간 시선 이탈 3~4초와 맞음(2.6절). 잠정 아님

# VATS: 최근 window_ms 중 영역 밖 누적
vats:
  window_ms: 30000            # 명세. Euro NCAP 2026 v1.2 (30초 중 누적 10초). 잠정 아님
  cumulative_ms: 10000        # 명세. Euro NCAP 2026 v1.2. 잠정 아님
  reset_enabled: false        # D6. 명세대로 초기화를 끈다. 켜면 2.9초 이탈과 2.1초 주시를 반복해도 이벤트가 나지 않는다
  reset_forward_ms: 2000      # 선택 값(reset_enabled일 때만 사용). Euro NCAP 2023 "전방 주시 2초면 초기화"(추정, 원문 미확인)

# 눈 감김 (8.1절). 4.5절의 검출기를 규칙용 임계값으로 한 번 더 돌린다.
closure:
  detector:
    enter_thr: 0.7            # 잠정. 규칙용 진입 임계값(특징용 0.5보다 높게). 실제 눈 감김으로 미검증, E0에서 확정
    exit_thr: 0.5             # 잠정. 규칙용 이탈 임계값. E0에서 확정
    min_duration_ms: 50       # 4.5절 기본값. feature_spec.json의 pipeline.run_detector와 같은 값으로 유지
    max_dt_ms: 200            # 4.5절 기본값. 위와 같음
    hold_ms: 500              # 4.5절 기본값. 끊긴 구간이 이 값 이하면 같은 감김으로 잇는다(그 안에서는 시작 이벤트를 내지 않음)
    velocity_lookback_samples: 2   # 4.5절 기본값. 규칙에서는 속도를 쓰지 않지만 검출기 설정을 온전히 둔다
  microsleep_ms: 1000         # 명세, D2. Euro NCAP 2026의 마이크로슬립 1~2초. 잠정 아님
  sleep_ms: 3000              # D2. "3.0초 이상"(Euro NCAP 2026). 명세의 "3초 초과"를 쓰려면 3001로 바꾼다

# 졸음 판정 (6장, 8.2절, D11)
drowsiness:
  # model | perclos | either. D11: 교차검증 결과(앱 조건 평가)가 기준을 모두 만족할 때만 model로 둔다.
  # 학습 전(v0, 무작위 가중치)이므로 기본 판정원은 perclos다.
  source: perclos
  model:
    onset_p: 0.6              # 사전 고정(6장). p_drowsy ≥ 이 값이 onset_steps 연속이면 시작. 시험 fold로 조정하지 않는다
    onset_steps: 10           # 사전 고정(6장)
    end_p: 0.4                # 사전 고정(6장). p_drowsy ≤ 이 값이 end_steps 연속이면 종료
    end_steps: 10             # 사전 고정(6장)
    refractory_ms: 60000      # 사전 고정(6장). 종료 후 이 시간 동안은 다시 시작하지 않는다
  perclos:
    onset_ratio: 0.15         # 잠정. perclos_60 ≥ 이 값이 onset_steps 연속이면 시작(8.2절). closure 0.8 기준 자체가 잠정
    onset_steps: 10           # 잠정(설계값, 8.2절)
    end_ratio: 0.10           # 잠정. perclos_60 < 이 값이 end_steps 연속이면 종료(8.2절)
    end_steps: 10             # 잠정(설계값, 8.2절)
    refractory_ms: 0          # 가정. 계획서는 PERCLOS 판정의 재시작 금지 시간을 적지 않았다. 0 = 없음

# 분석 불가 (8.1절)
unable_to_analyze:
  window_ms: 10000            # 잠정(설계값, 8.1절). 최근 10초
  min_face_ratio: 0.5         # 잠정(설계값, 8.1절). 얼굴 검출 비율(시간 기준, 데이터 없음 포함)이 이 값 미만이면 분석 불가

# 이벤트 종류별 심각도와 경고 정책 (8.2절 표, D3).
#   severity: 0~3. 8.2절 표의 설계값(공개 근거 없음)
#   cooldown_ms: 재경고 대기. 0 = 없음. 8.2절 표의 설계값(공개 근거 없음, 잠정)
#   repeat_ms: 상태가 이어지는 동안 경고를 되풀이하는 주기. 0 = 되풀이하지 않음. 8.2절 표의 설계값(잠정)
#   min_speed_kmh: 속도가 이 값 미만이면 경고를 억제. 0 = 억제 없음. 속도 입력이 없으면(None) 억제하지 않는다.
#     억제는 경고에만 적용하고 상태 이벤트는 그대로 낸다.
#     D3, Euro NCAP 2026 v1.2 값(경고는 20 km/h부터, 졸음은 50 km/h부터). 잠정 아님
events:
  calibrating:       {severity: 0, cooldown_ms: 0,      repeat_ms: 0,    min_speed_kmh: 0.0}    # 재경고 대기 없음, 속도 억제 없음
  unable_to_analyze: {severity: 1, cooldown_ms: 30000,  repeat_ms: 0,    min_speed_kmh: 0.0}    # 속도 억제 없음
  gaze_away_long:    {severity: 2, cooldown_ms: 10000,  repeat_ms: 0,    min_speed_kmh: 20.0}   # D3: 시선 이탈 경고
  vats:              {severity: 2, cooldown_ms: 30000,  repeat_ms: 0,    min_speed_kmh: 20.0}   # D3: 시선 이탈 경고
  drowsy:            {severity: 2, cooldown_ms: 300000, repeat_ms: 0,    min_speed_kmh: 50.0}   # D3: 졸음 경고
  microsleep:        {severity: 3, cooldown_ms: 5000,   repeat_ms: 0,    min_speed_kmh: 20.0}   # D3
  sleep:             {severity: 3, cooldown_ms: 0,      repeat_ms: 3000, min_speed_kmh: 20.0}   # 대기 없음, 3초마다 반복. D3

# 경고 우선순위, 높은 것부터 (8.2절: sleep, microsleep, gaze_away_long, vats, drowsy 순).
# 가정: 계획서의 순서에 없는 unable_to_analyze와 calibrating은 그 뒤에 둔다.
alert_priority: [sleep, microsleep, gaze_away_long, vats, drowsy, unable_to_analyze, calibrating]

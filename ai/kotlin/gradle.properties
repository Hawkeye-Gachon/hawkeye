# 저장소의 읽기 전용 입력. 경로는 kotlin/ 기준이고 build.gradle.kts가 rootProject.file(...)로 절대 경로를 만든다.
hawkeye.vectors=../tests/vectors
hawkeye.export=../export
# 차등 비교 자료(K23 (가), git 제외). 단계 0b부터 시험이 읽는다.
hawkeye.diffdata=.diffdata

# KGP가 자기 버전(2.1.21)의 kotlin-stdlib를 저절로 넣지 않게 한다. stdlib 2.0.21은 build.gradle.kts에 직접 적는다(계획 8.3절).
# 가정(A23): 속성 이름이 kotlin.stdlib.default.dependency다(E0에서 확인).
kotlin.stdlib.default.dependency=false
kotlin.code.style=official

# 소유자가 PC를 쓰는 중일 수 있다. 일꾼 수를 8로 제한한다.
org.gradle.workers.max=8
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
